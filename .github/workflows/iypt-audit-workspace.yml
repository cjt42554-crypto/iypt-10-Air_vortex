name: Apply and validate numerical audit fixes
on:
  push:
    branches: [main]
    paths: [.github/workflows/iypt-audit-workspace.yml, '.github/iypt-audit.patch.xz.*', .github/iypt-audit-current.md]
permissions:
  contents: write
jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply reviewed patch
        run: |
          python - <<'PY'
          import hashlib, lzma, pathlib, subprocess
          parts = [pathlib.Path(f'.github/iypt-audit.patch.xz.{i}') for i in range(3)]
          raw = lzma.decompress(b''.join(p.read_bytes() for p in parts))
          assert hashlib.sha256(raw).hexdigest() == 'db050cfd0a2fae22fd2af8784e60722bbd36ed55a160a777b145fcc994106de4'
          pathlib.Path('/tmp/audit.patch').write_bytes(raw)
          subprocess.run(['git', 'apply', '--check', '/tmp/audit.patch'], check=True)
          subprocess.run(['git', 'apply', '/tmp/audit.patch'], check=True)
          root = pathlib.Path('90_候选工作区')
          (root / '交接说明_history.md').write_bytes(b'')
          (root / '交接说明_current.md').write_bytes(pathlib.Path('.github/iypt-audit-current.md').read_bytes())
          PY
      - name: Install numerical dependencies
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0 matplotlib==3.10.8
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb xauth
          fi
      - name: Full unit suite with virtual display
        working-directory: 02_模拟程序
        env:
          PYTHONPATH: src:tests
          OPENBLAS_NUM_THREADS: '1'
          MPLBACKEND: Agg
        run: |
          set -o pipefail
          { python --version; xvfb-run -a python -m unittest discover -s tests -v; } 2>&1 | tee /tmp/iypt-audit-validation.log
      - name: Publish validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-validation
          path: /tmp/iypt-audit-validation.log
          retention-days: 14
      - name: Record results and commit tested source
        run: |
          python - <<'PY'
          import os, pathlib, re
          root = pathlib.Path('90_候选工作区')
          log = pathlib.Path('/tmp/iypt-audit-validation.log').read_text()
          dest = root / 'current/2026-09-05_数值审查修复/validation.log'
          dest.parent.mkdir(parents=True, exist_ok=True)
          dest.write_text(log)
          summary = '\n'.join(line for line in log.splitlines() if re.search(r'^Ran \d|^OK|^Python |\.\.\. skipped', line))
          with (root / '交接说明_current.md').open('a') as f:
              f.write('\n实际远端验证：在 `02_模拟程序` 执行 `PYTHONPATH=src:tests OPENBLAS_NUM_THREADS=1 xvfb-run -a python -m unittest discover -s tests -v`，退出码 `0`。NumPy 2.3.5、SciPy 1.17.0、Matplotlib 3.10.8。\n\n')
              f.write('工作流运行编号：`' + os.environ['GITHUB_RUN_ID'] + '`；测试对象是基于 `' + os.environ['GITHUB_SHA'] + '` 应用本轮补丁后的工作树。\n\n```text\n' + summary + '\n```\n')
          assert (root / '交接说明_history.md').stat().st_size == 0
          for p in pathlib.Path('.github').glob('iypt-audit.patch.xz.*'):
              p.unlink()
          pathlib.Path('.github/iypt-audit-current.md').unlink()
          pathlib.Path('.github/workflows/iypt-audit-workspace.yml').unlink()
          PY
          git diff --check
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: couple CLS mass and momentum, qualify bulk channel clearance and control divergence; refresh handoff'
          git push origin HEAD:main
          git rev-parse HEAD
