name: Repository entry documents

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: entry-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  entry-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test the checker
        run: python -m unittest discover -s tools -p 'test_repository_docs.py' -v
      - name: Check active entry links and fences
        run: python tools/check_repository_docs.py
