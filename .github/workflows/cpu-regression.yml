name: CPU software regression
on:
  push:
    paths: ['02_模拟程序/**', '.github/workflows/cpu-regression.yml']
  pull_request:
    paths: ['02_模拟程序/**', '.github/workflows/cpu-regression.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cpu-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: '02_模拟程序'
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Record environment
        run: python --version && python -m pip freeze
      - name: CPU software regression, not CUDA or apparatus qualification
        run: python -m unittest discover -s tests -v
