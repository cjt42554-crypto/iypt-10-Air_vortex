name: Temporary reviewed documentation publication
on:
  push:
    branches: [main]
    paths: [.github/workflows/temporary-docs-snapshot.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          lfs: false
      - name: Apply exact reviewed document edits and validate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import ast, base64, hashlib, json, os, pathlib, re, subprocess, sys, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          specs = {
              'iypt-5-Y_shaped_pendulum': ('1303f49388c4e2234a85929c48a4fd53d47431a9', '9b3e0ae7579ecad66dcd9e333d2acb58869da5e88c8397cf42660817a3b16450'),
              'iypt-10-Air_vortex': ('ea6cd703c32f15f7b4e35392bce856bd2c908598', '0c4f1f78ea0e4aa0a977585a5408fe224fe9ee38d8cb1b42f3a64c2539897e6d'),
              'iypt-13-Vortex_pendulum': ('2150cbcad0fef7b0d854ed1e1e25f5861c6769d1', 'd7f05a65f672557cdba8027aa893e23c2e798725c9d6971d95d8ecc6c27e5c39'),
          }
          def blob(sha):
              req = urllib.request.Request('https://api.github.com/repos/'+repo+'/git/blobs/'+sha, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.load(response)
              assert data['encoding'] == 'base64'
              return base64.b64decode(data['content'])
          sha, digest = specs[repo.split('/')[1]]
          raw = blob(sha)
          assert hashlib.sha256(raw).hexdigest() == digest
          payload = json.loads(raw)
          assert subprocess.check_output(['git','rev-parse','HEAD^'], text=True).strip() == payload['base']
          prepared = {}
          for item in payload['files']:
              path = pathlib.PurePosixPath(item['path'])
              assert not path.is_absolute() and '..' not in path.parts
              assert path.parts[0] in {'README.md','AGENTS.md','00_项目管理','03_研究记录','04_实验与数据'}
              assert path.name != '交接说明_history.md'
              assert path.suffix == '.md' or str(path) == '03_研究记录/维护/2026-09-06_理论程序对齐/5-03/compare_models.py'
              target = pathlib.Path(path)
              if item['old'] is None:
                  assert not target.exists()
                  content = blob(item['blob_sha'])
              else:
                  old = target.read_bytes()
                  assert hashlib.sha256(old).hexdigest() == item['old'], str(path)
                  text = old.decode('utf-8')
                  last = len(text)
                  for start, end, replacement in reversed(item['edits']):
                      assert 0 <= start <= end <= last
                      text = text[:start] + replacement + text[end:]
                      last = start
                  content = text.encode('utf-8')
                  if path.suffix == '.py':
                      old_tree, new_tree = ast.parse(old.decode()), ast.parse(text)
                      a = [node for node in ast.walk(old_tree) if isinstance(node, ast.Constant)]
                      b = [node for node in ast.walk(new_tree) if isinstance(node, ast.Constant)]
                      assert len(a) == len(b)
                      changed = [(x,y) for x,y in zip(a,b) if x.value != y.value]
                      assert len(changed) == 1 and all(isinstance(node.value,str) for node in changed[0])
                      changed[0][1].value = changed[0][0].value
                      assert ast.dump(old_tree) == ast.dump(new_tree)
              assert hashlib.sha256(content).hexdigest() == item['new'], str(path)
              prepared[str(path)] = content
          for name, content in prepared.items():
              pathlib.Path(name).write_bytes(content)
          assert pathlib.Path('00_项目管理/交接说明_history.md').stat().st_size == 0
          for name in ['AGENTS.md','README.md','00_项目管理/README.md','00_项目管理/交接说明_current.md']:
              assert not re.search(r'短期|长期|SHORT[_ -]TERM|LONG[_ -]TERM', pathlib.Path(name).read_text(), re.I), name
          subprocess.run(['git','diff','--exit-code','--','01_最终理论','02_模拟程序'], check=True)
          subprocess.run(['python3','-m','unittest','discover','-s','tools','-p','test_repository_docs.py','-v'], check=True)
          subprocess.run(['python3','tools/check_repository_docs.py'], check=True)
          sys.path.insert(0, str(pathlib.Path('tools').resolve()))
          from check_repository_docs import check_document
          errors = check_document(pathlib.Path.cwd(),'00_项目管理/Codex_下一阶段工作计划.md')
          assert not errors, errors
          subprocess.run(['git','diff','--check'], check=True)
          subprocess.run(['git','add','--',*prepared], check=True)
          subprocess.run(['git','diff','--cached','--check'], check=True)
          staged = set(subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')) - {''}
          assert staged == set(prepared), staged
          print('Reviewed hashes, neutral active guidance, new-plan links, 16 document tests, empty history, and unchanged formal theory/production verified.')
          PY
      - name: Commit and non-force push documentation only
        run: |
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: remove project-duration labels and define bounded Codex next-stage acceptance'
          git push origin HEAD:main
          git rev-parse HEAD
