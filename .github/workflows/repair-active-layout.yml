name: Strengthen active layout validation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject all legacy top-level path aliases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          policy = Path("tools/check_repository_policy.py")
          text = policy.read_text(encoding="utf-8")
          marker = '    "archive/pre-" + "03-90-consolidation",\n'
          addition = marker + '    "01-" + "最终理论",\n    "02-" + "模拟程序",\n'
          if text.count(marker) != 1:
              raise RuntimeError("unexpected repository-policy reference tuple")
          policy.write_text(text.replace(marker, addition), encoding="utf-8")
          PY
          python3 -m py_compile tools/check_repository_policy.py
          python3 tools/check_repository_policy.py
          git diff --check
      - name: Commit strengthened validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/check_repository_policy.py
          git commit -m "Strengthen active layout validation"
          git push
