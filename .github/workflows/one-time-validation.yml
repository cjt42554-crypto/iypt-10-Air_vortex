name: One-time repository validation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository policy
        run: python3 tools/check_repository_policy.py
      - name: Validate Markdown math
        if: ${{ hashFiles('tools/check_markdown_math.py') != '' }}
        run: python3 tools/check_markdown_math.py
      - name: Record successful validation by deleting probe branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref="heads/validation/policy-probe"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/${ref}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/${ref}" >/dev/null 2>&1; then
            echo "validation probe branch still exists" >&2
            exit 1
          fi
