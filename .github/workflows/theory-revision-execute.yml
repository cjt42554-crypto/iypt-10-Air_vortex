name: Execute forward theory revision
on:
  push:
    branches: [main]
    paths: [.github/workflows/theory-revision-execute.yml]
permissions:
  contents: write
jobs:
  revise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply theory patch
        shell: bash
        run: |
          python3 .github/apply_theory_revision.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('01_最终理论/01_前向预测理论.md')
          p.write_text('\n'.join(line.rstrip() if line.startswith(('> 结论边界：','> 理论修订：')) else line for line in p.read_text().splitlines())+'\n')
          p=Path('90_候选工作区/current/2026-09-05_前向理论修订/check_theory.py')
          lines=[]
          for line in p.read_text().splitlines():
              if 'tags=re.findall' in line:
                  lines.append("        tags=[v.split('}',1)[0] for v in s.split(chr(92)+'tag{')[1:]]")
                  lines.append('        self.assertGreater(len(tags),80)')
              elif 'self.assertNotIn' in line and '独立测得' in line:
                  lines.append("        self.assertNotIn('仍有强且可重复历史差异',s)")
              else:
                  lines.append(line)
          p.write_text('\n'.join(lines)+'\n')
          PY
      - name: Validate equations and manuscript
        shell: bash
        run: |
          set -euo pipefail
          evidence='90_候选工作区/current/2026-09-05_前向理论修订'
          {
            python3 --version
            python3 "$evidence/check_theory.py"
            if test -f tools/check_markdown_math.py; then
              python3 tools/check_markdown_math.py
            else
              echo 'No root Markdown checker; tested display delimiters and unique equation tags in theory regression.'
            fi
            git diff --check
          } 2>&1 | tee "$evidence/validation.txt"
      - name: Commit and push verified revision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path('90_候选工作区/交接说明_current.md')
          p.write_text(p.read_text()+'\n## 本轮实际提交前验证\n\n独立代数和文档回归 10 项通过；新增公式标签唯一且显示公式分隔符配对；git diff --check 通过。实际执行日志在上述 validation.txt。工作流运行编号：`'+os.environ['GITHUB_RUN_ID']+'`。没有运行生产求解器测试或大型流体计算。\n')
          Path('.github/apply_theory_revision.py').unlink()
          Path('.github/workflows/theory-revision-execute.yml').unlink()
          assert Path('90_候选工作区/交接说明_history.md').stat().st_size==0
          PY
          git diff --check
          git diff --stat
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '01_最终理论/01_前向预测理论.md' '90_候选工作区/交接说明_current.md' '90_候选工作区/交接说明_history.md' '90_候选工作区/current/2026-09-05_前向理论修订'
          git add -u .github/apply_theory_revision.py .github/workflows/theory-revision-execute.yml
          git commit -m 'fix(theory): correct gas-flow diagnostic and bound geometric prediction claims'
          git push origin HEAD:main
          git rev-parse HEAD
