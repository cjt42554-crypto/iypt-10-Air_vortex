name: Apply long-term research maintenance
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-longterm-maintenance.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Reapply reviewed changes with UTF-8 filename comparisons
        run: |
          python - <<'PY'
          import ast, subprocess, textwrap
          original='8b820ca12442afb9527061f6d4ccb97ff7fcb6c0'
          path='.github/workflows/apply-longterm-maintenance.yml'
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD^')==original, 'Concurrent main change: reread before editing'
          subprocess.run(['git','config','core.quotepath','false'],check=True)
          raw=git('show',original+':'+path)
          start="          python - <<'PY'\n"
          assert raw.count(start)==1
          source=textwrap.dedent(raw.split(start,1)[1].rsplit('          PY',1)[0])
          old="assert git('rev-parse','HEAD^')==base, 'Concurrent update: reread main'"
          assert source.count(old)==1
          source=source.replace(old,"assert git('merge-base','HEAD',base)==base, 'Baseline no longer an ancestor'",1)
          anchor='import re\nfrom urllib.parse'
          assert source.count(anchor)==1
          source=source.replace(anchor,"record('Previous apply run 33929349113 did not publish. This run compares UTF-8 paths without Git display quoting, preserves all scope checks and repeats validation.')\n"+anchor,1)
          ast.parse(source)
          exec(compile(source,'reviewed-maintenance.py','exec'))
          PY
