name: one-shot-hf3d-formal-promotion

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-hf3d-formal-promotion.yml

permissions:
  contents: write

concurrency:
  group: one-shot-hf3d-formal-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FORMAL_DIR: 02_模拟程序
      CANDIDATE_DIR: 90_候选工作区/current/01_HF3D数值资格
      PATCH_PATH: 90_候选工作区/current/01_HF3D数值资格/formal_candidate/0001-Add-transactional-HF3D-CFL-controller-candidate.patch
      FORMAL_BASELINE_COMMIT: 9b79b1ca39461ada176c6e7de5855a935b191983
      EXPECTED_PARENT_COMMIT: 93a9f9a6979a43a48a5ed81f6f7b2875acd6dd43
      EXPECTED_PATCH_SHA256: ee978d7bc9e1b27278b6f89a44c03f789780ba1cb11d648989ca8a3ee29ef4be
      EXPECTED_PATCHED_SOURCE_SHA256: 03ebc4dcd194d0ffadc7f24228720d775dc7d888ceb5a9737816368626482010
    steps:
      - name: Check out main with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify frozen baseline and patch identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_COMMIT"
          git diff --quiet "$FORMAL_BASELINE_COMMIT" HEAD -- "$FORMAL_DIR"
          printf '%s  %s\n' "$EXPECTED_PATCH_SHA256" "$PATCH_PATH" | sha256sum -c -
          git -C "$FORMAL_DIR" apply --check "$GITHUB_WORKSPACE/$PATCH_PATH"

      - name: Apply the frozen patch exactly once
        shell: bash
        run: |
          set -euo pipefail
          git -C "$FORMAL_DIR" apply "$GITHUB_WORKSPACE/$PATCH_PATH"
          git -C "$FORMAL_DIR" apply --check --reverse "$GITHUB_WORKSPACE/$PATCH_PATH"
          python - <<'PY'
          from pathlib import Path
          import subprocess

          expected = {
              "02_模拟程序/src/airvortex/backends/high_fidelity_3d.py",
              "02_模拟程序/src/airvortex/core/config.py",
              "02_模拟程序/src/airvortex/numerics/__init__.py",
              "02_模拟程序/src/airvortex/numerics/projection3d.py",
              "02_模拟程序/src/airvortex/numerics/projection3d_gpu.py",
              "02_模拟程序/tests/test_config_io.py",
              "02_模拟程序/tests/test_gpu_projection.py",
              "02_模拟程序/tests/test_high_fidelity_3d.py",
          }
          observed = {
              line
              for line in subprocess.check_output(
                  ["git", "diff", "--name-only", "--", "02_模拟程序"],
                  text=True,
              ).splitlines()
              if line
          }
          if observed != expected:
              raise SystemExit(
                  f"formal patch scope mismatch: expected={sorted(expected)!r}, observed={sorted(observed)!r}"
              )
          if subprocess.run(
              ["git", "diff", "--quiet", "--", "01_最终理论"], check=False
          ).returncode != 0:
              raise SystemExit("formal theory changed unexpectedly")
          Path("promotion_changed_files.json").write_text(
              __import__("json").dumps(sorted(observed), ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Install formal program and test runner
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e "./$FORMAL_DIR"

      - name: Verify promoted executable source identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from airvortex.io.archive import source_tree_identity

          identity = source_tree_identity("02_模拟程序")
          expected = os.environ["EXPECTED_PATCHED_SOURCE_SHA256"]
          if not identity.get("available"):
              raise SystemExit(f"formal source identity unavailable: {identity}")
          if identity.get("value") != expected:
              raise SystemExit(
                  f"formal source identity mismatch: expected={expected}, observed={identity.get('value')}"
              )
          Path("promotion_source_identity.json").write_text(
              json.dumps(identity, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Compile and run formal full test suite
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q "$FORMAL_DIR/src" "$FORMAL_DIR/tests"
          python -m pytest "$FORMAL_DIR/tests" -q --junitxml=formal-pytest.xml
          python - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = ET.parse("formal-pytest.xml").getroot()
          suites = [root] if root.tag.endswith("testsuite") else list(root.findall("testsuite"))
          tests = sum(int(item.attrib.get("tests", 0)) for item in suites)
          failures = sum(int(item.attrib.get("failures", 0)) for item in suites)
          errors = sum(int(item.attrib.get("errors", 0)) for item in suites)
          skipped = sum(int(item.attrib.get("skipped", 0)) for item in suites)
          passed = tests - failures - errors - skipped
          counts = {
              "run": tests,
              "passed": passed,
              "skipped": skipped,
              "failed": failures + errors,
              "failures": failures,
              "errors": errors,
          }
          if counts != {
              "run": 181,
              "passed": 177,
              "skipped": 4,
              "failed": 0,
              "failures": 0,
              "errors": 0,
          }:
              raise SystemExit(f"unexpected formal test counts: {counts}")
          Path("promotion_formal_test_counts.json").write_text(
              json.dumps(counts, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Run candidate qualification tests
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "$CANDIDATE_DIR"
            python -Werror -m unittest discover -s tests -v
          ) 2>&1 | tee candidate-unittest.log
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          text = Path("candidate-unittest.log").read_text(encoding="utf-8")
          match = re.search(r"Ran (\d+) tests? in", text)
          if match is None or int(match.group(1)) != 24 or "\nOK\n" not in "\n" + text:
              raise SystemExit("candidate qualification tests did not report 24/24 OK")
          Path("promotion_candidate_test_counts.json").write_text(
              json.dumps({"run": 24, "passed": 24, "failed": 0}, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Run formal self-check
        shell: bash
        run: |
          set -euo pipefail
          python -m airvortex self-check > formal-self-check.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("formal-self-check.json").read_text(encoding="utf-8"))
          checks = payload.get("checks", {})
          if payload.get("ok") is not True or len(checks) != 6:
              raise SystemExit(f"formal self-check failed or changed scope: {payload}")
          if not all(item.get("ok") is True for item in checks.values()):
              raise SystemExit(f"formal self-check contains a failed item: {payload}")
          PY

      - name: Check patch formatting and tracked source whitespace
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          import json
          from pathlib import Path

          paths = json.loads(Path("promotion_changed_files.json").read_text(encoding="utf-8"))
          errors = []
          for raw in paths:
              path = Path(raw)
              for number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  if "\t" in line:
                      errors.append(f"{path}:{number}: tab")
                  if line.rstrip(" ") != line:
                      errors.append(f"{path}:{number}: trailing space")
          if errors:
              raise SystemExit("\n".join(errors))
          PY

      - name: Write formal-promotion evidence and handoff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          from datetime import datetime
          import json
          import os
          from pathlib import Path
          import platform
          import subprocess
          from zoneinfo import ZoneInfo

          import numpy
          import scipy

          root = Path.cwd()
          candidate_dir = root / "90_候选工作区/current/01_HF3D数值资格/formal_candidate"
          changed = json.loads(Path("promotion_changed_files.json").read_text(encoding="utf-8"))
          source_identity = json.loads(Path("promotion_source_identity.json").read_text(encoding="utf-8"))
          formal_tests = json.loads(Path("promotion_formal_test_counts.json").read_text(encoding="utf-8"))
          candidate_tests = json.loads(Path("promotion_candidate_test_counts.json").read_text(encoding="utf-8"))
          self_check = json.loads(Path("formal-self-check.json").read_text(encoding="utf-8"))
          candidate_manifest = json.loads((candidate_dir / "candidate_manifest.json").read_text(encoding="utf-8"))
          fine_report = json.loads((candidate_dir / "fine_window_report.json").read_text(encoding="utf-8"))
          now = datetime.now(ZoneInfo("Asia/Tokyo")).isoformat(timespec="seconds")
          trigger_commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          parent_commit = subprocess.check_output(["git", "rev-parse", "HEAD^"], text=True).strip()

          report = {
              "schema_version": 1,
              "created_at": now,
              "status": "FORMAL_PROMOTION_CPU_PASS__CUDA_FORMAL_REPLAY_PENDING",
              "authorization": {
                  "received": True,
                  "instruction_summary": "按照交付文件完成任务",
                  "accepted_defaults": {
                      "cfl_controller_target_fraction": 0.95,
                      "maximum_cfl_step_retries": 4,
                      "dense_diagnostics": True,
                  },
                  "frozen_candidate_manifest_preserved": True,
                  "note": "candidate_manifest.json remains the immutable pre-authorization candidate snapshot; its authorization_received=false field is historical.",
              },
              "repository": {
                  "branch": "main",
                  "formal_baseline_commit": os.environ["FORMAL_BASELINE_COMMIT"],
                  "pre_workflow_parent_commit": parent_commit,
                  "workflow_trigger_commit": trigger_commit,
              },
              "candidate_patch": {
                  "path": os.environ["PATCH_PATH"],
                  "expected_sha256": os.environ["EXPECTED_PATCH_SHA256"],
                  "manifest_sha256": candidate_manifest["candidate_patch"]["sha256"],
                  "applied_exactly_once": True,
                  "hard_cfl_gate_changed": False,
              },
              "changes": {
                  "formal_theory_modified": False,
                  "formal_program_modified": True,
                  "formal_program_files": changed,
                  "candidate_evidence_rewritten": False,
              },
              "source_identity": {
                  "expected_sha256": os.environ["EXPECTED_PATCHED_SOURCE_SHA256"],
                  "observed": source_identity,
                  "match": source_identity.get("value") == os.environ["EXPECTED_PATCHED_SOURCE_SHA256"],
              },
              "validation": {
                  "formal_baseline_unchanged_before_apply": "PASS",
                  "patch_sha256": "PASS",
                  "git_apply_check": "PASS",
                  "reverse_apply_check_after_apply": "PASS",
                  "patch_scope_exact": "PASS",
                  "compileall": "PASS",
                  "formal_full_test_suite": formal_tests,
                  "candidate_qualification_tests": candidate_tests,
                  "formal_self_check": {
                      "run": len(self_check["checks"]),
                      "passed": sum(1 for item in self_check["checks"].values() if item["ok"]),
                      "failed": sum(1 for item in self_check["checks"].values() if not item["ok"]),
                  },
                  "git_diff_check": "PASS",
                  "whitespace_and_tab_scan": "PASS",
                  "isolated_cuda_tests_on_promoted_formal_path": "NOT_EXECUTED_NO_CUDA_ON_RUNNER",
                  "promoted_formal_0_013s_cuda_window": "NOT_EXECUTED_NO_CUDA_ON_RUNNER",
              },
              "environment": {
                  "python": platform.python_version(),
                  "numpy": numpy.__version__,
                  "scipy": scipy.__version__,
                  "runner": "GitHub-hosted Ubuntu CPU runner",
              },
              "prior_candidate_cuda_evidence": {
                  "isolated_cuda_tests": candidate_manifest["validation"]["isolated_cuda_tests"],
                  "fine_window_status": fine_report["status"],
                  "fine_window_gate_pass": fine_report["gate_pass"],
                  "fine_window_source_sha256_start": fine_report["archive"]["source_identity"]["source_tree_sha256_start"],
                  "fine_window_source_sha256_end": fine_report["archive"]["source_identity"]["source_tree_sha256_end"],
                  "same_executable_source_identity_as_promoted_formal": True,
                  "evidence_boundary": "The byte-identical executable source preserves relevance of the prior candidate CUDA evidence, but it is not a rerun from the promoted formal path.",
              },
              "not_performed": [
                  "isolated CUDA tests from the promoted formal path",
                  "0.013 s fine-grid CUDA replay from the promoted formal path",
                  "Q1R2 common-time-step refreeze",
                  "Q1R2 multi-grid and multi-time-step execution",
                  "numerical convergence qualification",
                  "physical validation",
                  "experimental validation",
              ],
              "q1r2_status": "NOT_FROZEN",
              "claim_ceiling": "FORMAL_IMPLEMENTATION_PROMOTED_AND_CPU_REVALIDATED__CUDA_FORMAL_REPLAY_PENDING__Q1R2_NOT_FROZEN__NO_GO_PHYSICAL_PREDICTION",
          }
          report_json = candidate_dir / "formal_promotion_report.json"
          report_json.write_text(
              json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          validation_rows = [
              ("冻结补丁 SHA-256", "PASS"),
              ("补丁应用与反向检查", "PASS"),
              ("正式可执行源码树身份", "PASS"),
              ("正式全量测试", f"{formal_tests['passed']} passed, {formal_tests['skipped']} skipped, {formal_tests['failed']} failed"),
              ("候选资格测试", f"{candidate_tests['passed']}/{candidate_tests['run']} passed"),
              ("正式 self-check", f"{len(self_check['checks'])}/{len(self_check['checks'])} passed"),
              ("compileall 与文本检查", "PASS"),
              ("提升后正式路径 CUDA 测试", "未执行：runner 无 CUDA"),
              ("提升后正式路径 0.013 s 细网格窗口", "未执行：runner 无 CUDA"),
          ]
          rows = "\n".join(f"| {name} | {result} |" for name, result in validation_rows)
          files = "\n".join(f"- `{path}`" for path in changed)
          report_md = candidate_dir / "formal_promotion_report.md"
          report_md.write_text(
              f"""# HF3D 事务性 CFL 控制器正式提升报告

状态：`{report['status']}`。

用户已授权按当前交接文件完成唯一待续任务。冻结补丁已原样应用到正式程序，接受控制目标比例 `0.95`、最多 `4` 次事务重试及新增稠密诊断字段。正式理论未修改。

## 正式程序变更

{files}

正式可执行源码树 SHA-256 为 `{source_identity['value']}`，与候选窗口绑定的冻结身份完全一致。

## 本轮验证

| 项目 | 结果 |
|---|---|
{rows}

## 证据边界

候选阶段已有 `5/5` 隔离 CUDA 测试和真实 `136 × 136 × 120`、`0.013 s` 细网格窗口通过；其执行源码树身份与本次提升后的正式源码完全一致。因此这些证据仍可用于说明补丁对应实现已在 CUDA 上运行过，但不能写成“已从正式目录重新执行”。本轮 GitHub runner 无 CUDA，故未重跑正式路径 CUDA 测试和细网格窗口。

Q1R2 仍为 `NOT_FROZEN`。旧登记步长 `7.5e-6 s` 的候选窗口命中比例不足 `0.95`，候选最小联合限步值 `5.82815205187083e-6 s` 也不是冻结共同步长。不得直接采用任一数值冻结 Q1R2。

## 当前结论上限

`{report['claim_ceiling']}`

这不是多网格或多时间步收敛通过，不是物理验证，也不是实验验证；当前仍不得给出装置级定量预测。
""",
              encoding="utf-8",
          )

          current = root / "90_候选工作区/交接说明_current.md"
          current.write_text(
              f"""# 当前交接

## 当前唯一待续任务

HF3D 事务性 CFL 控制器已获用户授权并按冻结补丁原样提升到正式程序。当前状态为 `FORMAL_PROMOTION_CPU_PASS__CUDA_FORMAL_REPLAY_PENDING`。正式理论 `01_最终理论/**` 未修改；正式程序的 5 个源码文件与 3 个测试文件已修改。

下一步必须在具备 CUDA 的环境中，从提升后的正式目录重新执行隔离 GPU 测试和 `0.013 s` 细网格失败窗口。两项均通过后，才能依据正式源码各空间层的真实稠密步长轨迹重新设计空间共同登记步长和时间递减层；在此之前不得冻结或运行 Q1R2。

## 必要入口

- 正式提升报告：`90_候选工作区/current/01_HF3D数值资格/formal_candidate/formal_promotion_report.md`、`formal_promotion_report.json`；
- 冻结补丁：`90_候选工作区/current/01_HF3D数值资格/formal_candidate/0001-Add-transactional-HF3D-CFL-controller-candidate.patch`；
- 原提升审查：`90_候选工作区/current/01_HF3D数值资格/formal_candidate/promotion_review.md`；
- 真实候选窗口：`formal_candidate/fine_window_report.md`、`fine_window_report.json`；
- 正式窗口配置与核验器：`formal_candidate/fine_window_pressure_1e-7.json`、`formal_candidate/analyse_fine_window.py`。

## 冻结身份

- 正式提升前的候选证据提交：`{parent_commit}`；
- 冻结补丁 SHA-256：`{os.environ['EXPECTED_PATCH_SHA256']}`；
- 提升后正式可执行源码树 SHA-256：`{source_identity['value']}`；
- 控制目标比例：`0.95`；最多事务重试：`4`；CFL 硬门未放宽。

## 本轮已完成

1. 确认正式程序自冻结基线以来未被其他提交修改，并核验补丁 SHA-256。
2. 在 `02_模拟程序/` 原样应用补丁；反向应用检查通过，变更范围精确为 5 个源码文件和 3 个测试文件。
3. 提升后正式可执行源码树身份与候选 CUDA 窗口绑定身份完全一致。
4. GitHub CPU runner 上正式全量测试 `177 passed, 4 skipped, 0 failed`；4 项跳过均为 CUDA 条件测试。
5. 候选资格测试 `24/24`、正式 `self-check` `6/6`、`compileall`、`git diff --check` 和尾随空格/制表符扫描通过。
6. 冻结候选清单未改写；其中 `authorization_received=false` 是用户授权前的历史快照，不代表当前未授权。

## 尚未完成及结论边界

1. 本轮 runner 无 CUDA，未从提升后的正式路径重跑 5 项隔离 CUDA 测试，也未重跑 `136 × 136 × 120`、`0.013 s` 真实细网格窗口。
2. 候选阶段上述 CUDA 证据绑定的可执行源码树与正式提升后逐字节身份相同，因此仍有实现级相关性；但不得把它表述为正式路径已重新执行。
3. 旧登记步长 `7.5e-6 s` 的候选命中比例为 `0.928856`，低于资格门 `0.95`；`5.82815205187083e-6 s` 也只是候选窗口中的最小联合限步值，不是冻结步长。
4. Q1R2 仍为 `NOT_FROZEN`；没有取得多网格/多时间步收敛、数值资格、物理验证或实验验证通过。
5. 当前结论上限为 `FORMAL_IMPLEMENTATION_PROMOTED_AND_CPU_REVALIDATED__CUDA_FORMAL_REPLAY_PENDING__Q1R2_NOT_FROZEN__NO_GO_PHYSICAL_PREDICTION`。

## 下一次执行顺序

1. 在正式程序上运行 5 项隔离 CUDA 测试，确认 CUDA 投影、CPU/CUDA 对等和 GPU 压力历史回滚。
2. 用 `fine_window_pressure_1e-7.json` 从正式源码重跑到 `0.013 s`，并用 `analyse_fine_window.py` 核验正式源码身份、CUDA 无回退、旧故障时刻覆盖、CFL、散度、压力残差和全部质量门。
3. 依据提升后各空间层真实轨迹冻结新的空间共同登记步长；不得直接沿用候选窗口的单个最小步长。
4. 冻结并执行全新 Q1R2：统一压力容差 `1e-7`，空间组共同实际步长，时间组实际步长严格递减，实际 CUDA 无回退。
5. 即使 Q1R2 通过，物理预测与实验验证仍保持 `NO-GO`，之后另行设计更长时和平滑区/近拓扑区资格。
""",
              encoding="utf-8",
          )

          history = root / "90_候选工作区/交接说明_history.md"
          with history.open("a", encoding="utf-8") as handle:
              handle.write(
                  f"\n- {now}：用户授权按当前交接完成 HF3D CFL 控制器正式提升；冻结补丁原样应用到 `02_模拟程序/`，正式源码树身份匹配，CPU 全量测试 177 通过/4 CUDA 跳过、候选测试 24/24、self-check 6/6。正式路径 CUDA 测试和 0.013 s 窗口待在 CUDA 环境重跑；Q1R2 仍未冻结。\n"
              )
          PY

      - name: Verify final change scope and commit to main
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            promotion_changed_files.json \
            promotion_source_identity.json \
            promotion_formal_test_counts.json \
            promotion_candidate_test_counts.json \
            formal-pytest.xml \
            candidate-unittest.log \
            formal-self-check.json
          git add -A -- \
            "$FORMAL_DIR" \
            "$CANDIDATE_DIR/formal_candidate/formal_promotion_report.json" \
