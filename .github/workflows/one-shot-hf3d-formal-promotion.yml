name: one-shot-hf3d-formal-promotion

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-hf3d-formal-promotion.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out main with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install formal program and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e "./02_模拟程序"

      - name: Promote, validate, report, and commit
        run: >-
          python -c 'from pathlib import Path; p=Path("90_候选工作区/current/01_HF3D数值资格/formal_candidate/promote_formal_once.py"); s=p.read_text(encoding="utf-8").replace("parents[5]", "parents[4]", 1); ns={"__name__":"__main__","__file__":str(p)}; exec(compile(s, str(p), "exec"), ns)'
