name: Remove obsolete branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete branch reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref="heads/archive/pre-03-90-consolidation-20260824"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/${ref}" >/dev/null 2>&1; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/${ref}"
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/${ref}" >/dev/null 2>&1; then
            echo "obsolete branch still exists" >&2
            exit 1
          fi
