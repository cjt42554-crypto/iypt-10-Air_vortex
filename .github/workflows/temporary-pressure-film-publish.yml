name: Temporary pressure and film theory publication
on:
  push:
    branches: [main]
    paths: [.github/workflows/temporary-pressure-film-publish.yml]
permissions:
  contents: write
jobs:
  verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply reviewed patch with source and destination checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          repo = 'cjt42554-crypto/iypt-10-Air_vortex'
          shas = ['b8ac5940e321cee81627a4c7f802abc98fe2f203','865f6c775561bdc0693862b5dbfdf83078d30aa2','cd66cb04c8c6f08e6e3ac85cd71410787945a811','0302fe31e5bc1cdceef25b5976d80c9c59d43937','9244c8203e9eb39159b7925d72a9dd1737a28a77']
          chunks=[]
          for sha in shas:
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs/{sha}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as response:
                  obj=json.load(response)
              chunks.append(base64.b64decode(obj['content']))
          raw=b''.join(chunks)
          assert hashlib.sha256(raw).hexdigest()=='681b9c0109469157d7a278266bcc2c701c0e1be2c2299f55356303130a802d89'
          payload=json.loads(lzma.decompress(raw))
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()==payload['base']
          allowed={'README.md','00_项目管理/交接说明_current.md','01_最终理论/01_前向预测理论.md','01_最终理论/02_前向预测理论的数值计算理论.md','01_最终理论/README.md'}
          prefix='03_研究记录/维护/2026-09-05_压力与薄膜理论修订/'
          assert set(payload['old'])==set(payload['expected'])
          for name,old in payload['old'].items():
              p=pathlib.Path(name)
              assert not p.is_absolute() and '..' not in p.parts
              assert name in allowed or name.startswith(prefix)
              assert (not p.exists()) if old is None else hashlib.sha256(p.read_bytes()).hexdigest()==old
          patch=payload['patch'].encode()
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          for name,expected in payload['expected'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==expected,name
          assert pathlib.Path('00_项目管理/交接说明_history.md').stat().st_size==0
          assert subprocess.check_output(['git','rev-parse','HEAD:02_模拟程序'],text=True).strip()=='6e6b81e41a3aecae1927c70b902938a1a6b90b74'
          subprocess.run(['git','diff','--exit-code','--','02_模拟程序'],check=True)
          subprocess.run(['git','diff','--check'],check=True)
          pathlib.Path('/tmp/pressure-film-paths.json').write_text(json.dumps(list(payload['expected']),ensure_ascii=False))
          print('Reviewed scientific patch and all destination hashes verified; production tree and empty history unchanged.')
          PY
      - name: Install independent verification dependencies
        run: python -m pip install 'numpy==2.3.5' 'scipy==1.17.0' 'sympy==1.14.0'
      - name: Independent theory and full-checkout document validation
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess,sys
          root=pathlib.Path.cwd()
          rec=root/'03_研究记录/维护/2026-09-05_压力与薄膜理论修订'
          commands=[
              ('verification-remote.txt',[sys.executable,str(rec/'verify_pressure_film.py'),'--output',str(rec/'results-remote.json')]),
              ('docs-unit-remote.txt',[sys.executable,'-m','unittest','discover','-s','tools','-p','test_repository_docs.py','-v']),
              ('docs-entry-remote.txt',[sys.executable,'tools/check_repository_docs.py'])]
          summary=[]
          for name,cmd in commands:
              with (rec/name).open('w') as log:
                  p=subprocess.run(cmd,cwd=root,stdout=log,stderr=subprocess.STDOUT,timeout=90)
              text=(rec/name).read_text()
              print(name+'\n'+text[-1600:],flush=True)
              match=re.search(r'Ran (\d+) tests?',text)
              summary.append({'log':name,'command':cmd,'exit':p.returncode,'tests':int(match.group(1)) if match else None})
              (rec/'remote-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n')
              if p.returncode: raise RuntimeError('Validation failed: '+name)
          assert [v['tests'] for v in summary]==[33,16,None]
          results=json.loads((rec/'results-remote.json').read_text())
          assert results['tests']=={'run':33,'failures':0,'errors':0,'skipped':0}
          assert results['theory_sha256']=='4698b016a4a27110b8e147fe99d216a2b8589ffd96af26c4b5888a39c15a39b7'
          assert (rec/'solver-regression.exit').read_text().strip()=='0'
          raw=(rec/'solver-regression.txt').read_text()
          assert 'Ran 200 tests in 122.424s' in raw and raw.rstrip().endswith('OK (skipped=5)')
          with (rec/'README.md').open('a') as f:
              f.write('\n## 远端完整 checkout 复核\n\n本轮远端重新执行 33 项独立检查、16 项文档检查器自测及完整仓库活动入口/布局检查，全部通过；命令、退出码和日志见 `remote-summary.json`、`verification-remote.txt`、`docs-unit-remote.txt`、`docs-entry-remote.txt`。原程序的 200 项回归是本地实际执行，远端核对其冻结日志和源码不变，没有冒充又运行一次完整回归。原本地结果与首轮失败记录不覆盖。\n')
          with (root/'00_项目管理/交接说明_current.md').open('a') as f:
              f.write('\n## 本轮远端复核\n\n完整仓库上独立复跑 33 项理论/文档一致性检查、16 项入口检查器自测及活动链接/布局检查，全部通过。见[远端摘要](../03_研究记录/维护/2026-09-05_压力与薄膜理论修订/remote-summary.json)及同目录原始日志。完整生产回归仍指上述本地 200 项实际运行；生产代码未改，不将该结果解释为新增后端完成。\n')
          (rec/'publication-workflow.yml').write_bytes((root/'.github/workflows/temporary-pressure-film-publish.yml').read_bytes())
          metadata={'source_commit':'2461446290106ae6d49b6922cc152b320e8c3a92','publishing_parent':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'payload_sha256':'681b9c0109469157d7a278266bcc2c701c0e1be2c2299f55356303130a802d89','production_tree_sha':'6e6b81e41a3aecae1927c70b902938a1a6b90b74','theory_sha256':results['theory_sha256'],'new_modes_in_production':False}
          (rec/'publication.json').write_text(json.dumps(metadata,ensure_ascii=False,indent=2)+'\n')
          subprocess.run([sys.executable,'tools/check_repository_docs.py'],check=True)
          subprocess.run(['git','diff','--exit-code','--','02_模拟程序'],check=True)
          assert (root/'00_项目管理/交接说明_history.md').stat().st_size==0
          subprocess.run(['git','diff','--check'],check=True)
          PY
      - name: Commit and non-force push verified scientific changes
        run: |
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import json,pathlib,subprocess
          names=json.loads(pathlib.Path('/tmp/pressure-film-paths.json').read_text())
          rec=pathlib.Path('03_研究记录/维护/2026-09-05_压力与薄膜理论修订')
          names += [p.as_posix() for p in rec.iterdir() if p.is_file()]
          subprocess.run(['git','add','-f','--',*sorted(set(names))],check=True)
          PY
          git diff --cached --check
          git commit -m 'theory: add momentum-consistent pressure, Stokes mobility and near-contact film prediction'
          git push origin HEAD:main
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pressure-film-verification
          path: |
            03_研究记录/维护/2026-09-05_压力与薄膜理论修订/
            01_最终理论/01_前向预测理论.md
            00_项目管理/交接说明_current.md
          retention-days: 7
