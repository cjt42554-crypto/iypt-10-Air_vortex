name: Finalize forward theory pressure scope
on:
  push:
    branches: [main]
    paths: [.github/workflows/theory-finalize.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Clarify the pressure diagnostic activation domain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('01_最终理论/01_前向预测理论.md')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()=='b9fc8326f9f610e9f349f5d11c40f3c1dc887999'
          s=p.read_text()
          old='### 11.3 由局部连续性检查气体等压近似\n\n'
          new=old+'开放头空间与受限气道须区分。下列细管诊断只在气体被迫沿狭窄受限通路交换时使用；气道尚未形成且气相可作为开放大气储库时，不因通道半径未定义就自动触发失败，而应使用开放储库的压力误差依据。若未触及磁体前的漏斗已足够狭窄而使气体阻力不可忽略，也须检查局部气体流动，不能仅凭“未贯通”豁免。第 5.3 节的气体退出时刻按当前几何实际适用的压力模型判断。\n\n'
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          p=Path('90_候选工作区/current/2026-09-05_前向理论修订/check_theory.py')
          s=p.read_text()
          marker="        self.assertIn('局部连续性',s)"
          assert s.count(marker)==1
          p.write_text(s.replace(marker,marker+"\n        self.assertIn('开放头空间与受限气道须区分',s)"))
          c=Path('90_候选工作区/交接说明_current.md')
          c.write_text(c.read_text()+'\n## 定稿复核\n\n补充开放大气头空间与狭窄受限气道的适用区分：尚无通道时不因半径未定义而误拒所有前期漏斗预测；已有受限气流风险时仍需压力依据，未贯通也不能自动豁免。定稿后重跑同一组 10 项回归，日志见同目录 final-validation.txt。\n')
          PY
      - name: Revalidate final manuscript
        shell: bash
        run: |
          set -euo pipefail
          d='90_候选工作区/current/2026-09-05_前向理论修订'
          {
            python3 "$d/check_theory.py"
            if test -f tools/check_markdown_math.py; then python3 tools/check_markdown_math.py; fi
            git diff --check
          } 2>&1 | tee "$d/final-validation.txt"
      - name: Commit and push final revision
        run: |
          set -euo pipefail
          rm .github/workflows/theory-finalize.yml
          test ! -s '90_候选工作区/交接说明_history.md'
          git diff --check
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '01_最终理论/01_前向预测理论.md' '90_候选工作区/交接说明_current.md' '90_候选工作区/current/2026-09-05_前向理论修订'
          git add -u .github/workflows/theory-finalize.yml
          git commit -m 'docs(theory): scope gas-pressure checks to the actual gas geometry'
          git push origin HEAD:main
          git rev-parse HEAD
