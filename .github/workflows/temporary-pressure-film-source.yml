name: Temporary pressure and film theory source
on:
  push:
    branches: [main]
    paths: [.github/workflows/temporary-pressure-film-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Package tracked theory and verification inputs
        run: |
          git rev-parse HEAD > /tmp/source-commit.txt
          git ls-tree -r --name-only HEAD > /tmp/tracked-paths.txt
          git archive --format=zip -o /tmp/theory-source.zip HEAD -- README.md AGENTS.md 00_项目管理 01_最终理论 02_模拟程序 tools .github .gitignore
      - uses: actions/upload-artifact@v4
        with:
          name: pressure-film-source
          path: |
            /tmp/source-commit.txt
            /tmp/tracked-paths.txt
            /tmp/theory-source.zip
          retention-days: 1
