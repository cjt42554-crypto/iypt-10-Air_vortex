name: Final repository validation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate final repository state
        run: |
          set +e
          log=/tmp/final-validation.log
          summary=/tmp/final-validation-summary.txt
          : > "$log"
          : > "$summary"
          failed=0

          run_step() {
            label="$1"
            shift
            printf '\n[%s]\n$' "$label" >> "$log"
            printf ' %q' "$@" >> "$log"
            printf '\n' >> "$log"
            "$@" >> "$log" 2>&1
            status=$?
            printf '%s=%s\n' "$label" "$status" >> "$summary"
            if (( status != 0 )); then
              failed=1
            fi
          }

          run_step policy python3 tools/check_repository_policy.py
          if [[ -f tools/check_markdown_math.py ]]; then
            run_step markdown_math python3 tools/check_markdown_math.py
          fi
          run_step git_diff_check git diff --check
          run_step shell_syntax bash -lc 'find "02_模拟程序" -type f -name "*.sh" -print0 | xargs -0 -r -n1 bash -n'
          run_step compile_python python3 -m compileall -q "02_模拟程序/src" "02_模拟程序/run.py"
          run_step create_venv python3 -m venv /tmp/airvortex
          run_step upgrade_pip /tmp/airvortex/bin/python -m pip install --upgrade pip
          run_step install_package /tmp/airvortex/bin/python -m pip install -e "./02_模拟程序" pytest
          run_step tests /tmp/airvortex/bin/python -m pytest -q "02_模拟程序/tests"
          run_step cli_help /tmp/airvortex/bin/python -m airvortex --help

          status=PASS
          if (( failed != 0 )); then status=FAIL; fi
          result="90_候选工作区/current/final-validation-result.txt"
          mkdir -p "$(dirname "$result")"
          {
            printf 'status=%s\n' "$status"
            printf 'source_sha=%s\n' "$GITHUB_SHA"
            cat "$summary"
            printf 'log_gzip_base64='
            gzip -c "$log" | base64 -w0
            printf '\n'
          } > "$result"

          rm -f .github/workflows/final-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/workflows/final-validation.yml "$result"
          git commit -m "Record final repository validation"
          git push
          exit "$failed"
